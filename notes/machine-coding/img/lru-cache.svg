<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 480" width="860" height="480" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
  <title>LRU cache: hash map plus doubly linked list</title>
  <style>
    .t { fill: #0f172a; font-size: 14px; }
    .h { fill: #0f172a; font-size: 17px; font-weight: 600; }
    .s { fill: #475569; font-size: 12.5px; }
    .k { fill: #0f172a; font-size: 16px; font-weight: 600; }
    .b { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.5; }
    .node { fill: #eff6ff; stroke: #2563eb; stroke-width: 1.8; }
    .dummy { fill: #f1f5f9; stroke: #64748b; stroke-width: 1.5; stroke-dasharray: 5 4; }
    .lru { fill: #fef2f2; stroke: #dc2626; stroke-width: 1.8; stroke-dasharray: 6 4; }
    .mru { fill: #f0fdf4; stroke: #16a34a; stroke-width: 1.8; }
    .ln { stroke: #334155; stroke-width: 1.6; fill: none; }
    .ptr { stroke: #7c3aed; stroke-width: 1.4; fill: none; stroke-dasharray: 4 3; }
  </style>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#334155"/>
    </marker>
    <marker id="p" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#7c3aed"/>
    </marker>
  </defs>

  <rect x="1" y="1" width="858" height="478" rx="14" fill="#ffffff" stroke="#e2e8f0" stroke-width="2"/>
  <text x="30" y="38" class="h">LRU cache = hash map + doubly linked list (capacity 3)</text>

  <!-- Linked list -->
  <text x="250" y="66" class="s">Doubly linked list: order of use</text>
  <rect x="250" y="80" width="70" height="50" rx="8" class="dummy"/>
  <text x="285" y="110" class="t" text-anchor="middle">HEAD</text>

  <rect x="360" y="80" width="90" height="50" rx="8" class="node"/>
  <text x="405" y="111" class="k" text-anchor="middle">A</text>
  <rect x="490" y="80" width="90" height="50" rx="8" class="node"/>
  <text x="535" y="111" class="k" text-anchor="middle">C</text>
  <rect x="620" y="80" width="90" height="50" rx="8" class="lru"/>
  <text x="665" y="111" class="k" text-anchor="middle">B</text>

  <rect x="750" y="80" width="70" height="50" rx="8" class="dummy"/>
  <text x="785" y="110" class="t" text-anchor="middle">TAIL</text>

  <line x1="322" y1="105" x2="358" y2="105" class="ln" marker-start="url(#a)" marker-end="url(#a)"/>
  <line x1="452" y1="105" x2="488" y2="105" class="ln" marker-start="url(#a)" marker-end="url(#a)"/>
  <line x1="582" y1="105" x2="618" y2="105" class="ln" marker-start="url(#a)" marker-end="url(#a)"/>
  <line x1="712" y1="105" x2="748" y2="105" class="ln" marker-start="url(#a)" marker-end="url(#a)"/>

  <text x="405" y="152" class="s" text-anchor="middle" style="fill:#16a34a">most recent</text>
  <text x="665" y="152" class="s" text-anchor="middle" style="fill:#dc2626">least recent</text>
  <text x="665" y="168" class="s" text-anchor="middle" style="fill:#dc2626">(evicted next)</text>

  <!-- Hash map -->
  <text x="30" y="196" class="s">Hash map: key → node, O(1)</text>
  <rect x="30" y="206" width="170" height="108" rx="8" class="b"/>
  <line x1="30" y1="242" x2="200" y2="242" stroke="#e2e8f0"/>
  <line x1="30" y1="278" x2="200" y2="278" stroke="#e2e8f0"/>
  <line x1="90" y1="206" x2="90" y2="314" stroke="#e2e8f0"/>
  <text x="60" y="229" class="k" text-anchor="middle">A</text>
  <text x="60" y="265" class="k" text-anchor="middle">C</text>
  <text x="60" y="301" class="k" text-anchor="middle">B</text>
  <circle cx="185" cy="224" r="4" fill="#7c3aed"/>
  <circle cx="185" cy="260" r="4" fill="#7c3aed"/>
  <circle cx="185" cy="296" r="4" fill="#7c3aed"/>
  <text x="135" y="229" class="s" text-anchor="middle">node</text>
  <text x="135" y="265" class="s" text-anchor="middle">node</text>
  <text x="135" y="301" class="s" text-anchor="middle">node</text>

  <path d="M189,224 C 300,224 380,200 400,134" class="ptr" marker-end="url(#p)"/>
  <path d="M189,260 C 340,260 510,230 530,134" class="ptr" marker-end="url(#p)"/>
  <path d="M189,296 C 400,296 640,260 660,174" class="ptr" marker-end="url(#p)"/>

  <!-- Operations -->
  <line x1="30" y1="340" x2="830" y2="340" stroke="#e2e8f0" stroke-width="1.5"/>

  <text x="30" y="378" class="t" font-weight="600">get(B)</text>
  <text x="30" y="396" class="s">hit: move B to front</text>
  <g transform="translate(250,356)">
    <rect width="60" height="34" rx="6" class="dummy"/><text x="30" y="22" class="s" text-anchor="middle">HEAD</text>
    <rect x="80" width="60" height="34" rx="6" class="mru"/><text x="110" y="23" class="k" text-anchor="middle">B</text>
    <rect x="160" width="60" height="34" rx="6" class="node"/><text x="190" y="23" class="k" text-anchor="middle">A</text>
    <rect x="240" width="60" height="34" rx="6" class="lru"/><text x="270" y="23" class="k" text-anchor="middle">C</text>
    <rect x="320" width="60" height="34" rx="6" class="dummy"/><text x="350" y="22" class="s" text-anchor="middle">TAIL</text>
    <line x1="62" y1="17" x2="78" y2="17" class="ln"/><line x1="142" y1="17" x2="158" y2="17" class="ln"/>
    <line x1="222" y1="17" x2="238" y2="17" class="ln"/><line x1="302" y1="17" x2="318" y2="17" class="ln"/>
  </g>

  <text x="30" y="436" class="t" font-weight="600">put(D, 4)</text>
  <text x="30" y="454" class="s">full: drop node before TAIL</text>
  <g transform="translate(250,414)">
    <rect width="60" height="34" rx="6" class="dummy"/><text x="30" y="22" class="s" text-anchor="middle">HEAD</text>
    <rect x="80" width="60" height="34" rx="6" class="mru"/><text x="110" y="23" class="k" text-anchor="middle">D</text>
    <rect x="160" width="60" height="34" rx="6" class="node"/><text x="190" y="23" class="k" text-anchor="middle">B</text>
    <rect x="240" width="60" height="34" rx="6" class="node"/><text x="270" y="23" class="k" text-anchor="middle">A</text>
    <rect x="320" width="60" height="34" rx="6" class="dummy"/><text x="350" y="22" class="s" text-anchor="middle">TAIL</text>
    <line x1="62" y1="17" x2="78" y2="17" class="ln"/><line x1="142" y1="17" x2="158" y2="17" class="ln"/>
    <line x1="222" y1="17" x2="238" y2="17" class="ln"/><line x1="302" y1="17" x2="318" y2="17" class="ln"/>
    <rect x="410" width="60" height="34" rx="6" class="lru" opacity="0.6"/><text x="440" y="23" class="k" text-anchor="middle" opacity="0.6">C</text>
    <line x1="414" y1="30" x2="466" y2="4" stroke="#dc2626" stroke-width="2"/>
    <text x="482" y="14" class="s" style="fill:#dc2626">removed from</text>
    <text x="482" y="30" class="s" style="fill:#dc2626">list + map</text>
  </g>
</svg>
