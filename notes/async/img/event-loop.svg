<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 500" width="860" height="500" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
  <title>Event loop architecture</title>
  <style>
    .t { fill: #0f172a; font-size: 14px; }
    .h { fill: #0f172a; font-size: 17px; font-weight: 600; }
    .bt { fill: #0f172a; font-size: 15px; font-weight: 600; }
    .s { fill: #475569; font-size: 12.5px; }
    .ln { stroke: #334155; stroke-width: 1.7; fill: none; }
  </style>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#334155"/>
    </marker>
  </defs>

  <rect x="1" y="1" width="858" height="498" rx="14" fill="#ffffff" stroke="#e2e8f0" stroke-width="2"/>
  <text x="30" y="38" class="h">Event loop: one thread, one call stack, several queues</text>

  <!-- Call stack -->
  <rect x="30" y="64" width="200" height="320" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="1.8"/>
  <text x="130" y="90" class="bt" text-anchor="middle">Call stack</text>
  <text x="130" y="108" class="s" text-anchor="middle">main thread, one at a time</text>
  <text x="130" y="236" class="s" text-anchor="middle">grows ↑ as functions call</text>
  <rect x="50" y="250" width="160" height="34" rx="6" fill="#ffffff" stroke="#93c5fd"/>
  <text x="130" y="272" class="t" text-anchor="middle">fetchPrices()</text>
  <rect x="50" y="290" width="160" height="34" rx="6" fill="#ffffff" stroke="#93c5fd"/>
  <text x="130" y="312" class="t" text-anchor="middle">onClick()</text>
  <rect x="50" y="330" width="160" height="34" rx="6" fill="#ffffff" stroke="#93c5fd"/>
  <text x="130" y="352" class="t" text-anchor="middle">(task)</text>

  <!-- Web APIs -->
  <rect x="320" y="64" width="250" height="120" rx="10" fill="#f8fafc" stroke="#64748b" stroke-width="1.5"/>
  <text x="445" y="90" class="bt" text-anchor="middle">Web APIs (other threads)</text>
  <text x="445" y="116" class="t" text-anchor="middle">timers · fetch / network</text>
  <text x="445" y="138" class="t" text-anchor="middle">DOM events · file reading</text>
  <text x="445" y="162" class="s" text-anchor="middle">do the waiting, then queue a callback</text>

  <!-- Render -->
  <rect x="610" y="64" width="220" height="120" rx="10" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.8"/>
  <text x="720" y="90" class="bt" text-anchor="middle">Render step</text>
  <text x="720" y="114" class="t" text-anchor="middle">~every 16.7 ms (60 Hz)</text>
  <text x="720" y="136" class="t" text-anchor="middle">rAF → style → layout</text>
  <text x="720" y="156" class="t" text-anchor="middle">→ paint → composite</text>

  <path d="M232,120 L318,120" class="ln" marker-end="url(#a)"/>
  <text x="275" y="110" class="s" text-anchor="middle">start</text>

  <!-- Task queue -->
  <rect x="320" y="226" width="510" height="64" rx="10" fill="#fffbeb" stroke="#d97706" stroke-width="1.8"/>
  <text x="340" y="250" class="bt">Task queue (macrotasks)</text>
  <g font-size="12.5">
    <rect x="340" y="258" width="104" height="24" rx="12" fill="#fff" stroke="#f59e0b"/><text x="392" y="275" class="s" text-anchor="middle">setTimeout cb</text>
    <rect x="452" y="258" width="60" height="24" rx="12" fill="#fff" stroke="#f59e0b"/><text x="482" y="275" class="s" text-anchor="middle">click</text>
    <rect x="520" y="258" width="80" height="24" rx="12" fill="#fff" stroke="#f59e0b"/><text x="560" y="275" class="s" text-anchor="middle">message</text>
    <rect x="608" y="258" width="104" height="24" rx="12" fill="#fff" stroke="#f59e0b"/><text x="660" y="275" class="s" text-anchor="middle">network cb</text>
  </g>

  <!-- Microtask queue -->
  <rect x="320" y="320" width="510" height="64" rx="10" fill="#f5f3ff" stroke="#7c3aed" stroke-width="1.8"/>
  <text x="340" y="344" class="bt">Microtask queue (higher priority)</text>
  <rect x="340" y="352" width="104" height="24" rx="12" fill="#fff" stroke="#a78bfa"/><text x="392" y="369" class="s" text-anchor="middle">promise.then</text>
  <rect x="452" y="352" width="120" height="24" rx="12" fill="#fff" stroke="#a78bfa"/><text x="512" y="369" class="s" text-anchor="middle">code after await</text>
  <rect x="580" y="352" width="120" height="24" rx="12" fill="#fff" stroke="#a78bfa"/><text x="640" y="369" class="s" text-anchor="middle">queueMicrotask</text>
  <rect x="706" y="352" width="118" height="24" rx="12" fill="#fff" stroke="#a78bfa"/><text x="765" y="369" class="s" text-anchor="middle">MutationObserver</text>

  <path d="M445,186 L445,224" class="ln" marker-end="url(#a)"/>
  <text x="455" y="210" class="s">callback ready</text>

  <path d="M318,258 L234,258" class="ln" marker-end="url(#a)"/>
  <text x="276" y="250" class="s" text-anchor="middle">take ONE</text>
  <path d="M318,352 L234,352" class="ln" marker-end="url(#a)"/>
  <text x="276" y="344" class="s" text-anchor="middle">run ALL</text>

  <!-- One turn -->
  <line x1="30" y1="408" x2="830" y2="408" stroke="#e2e8f0" stroke-width="1.5"/>
  <text x="30" y="434" class="t" font-weight="600">One turn of the loop</text>
  <g>
    <rect x="30" y="446" width="170" height="36" rx="8" fill="#fffbeb" stroke="#d97706"/>
    <text x="115" y="469" class="t" text-anchor="middle">1. Run ONE task</text>
    <rect x="236" y="446" width="200" height="36" rx="8" fill="#f5f3ff" stroke="#7c3aed"/>
    <text x="336" y="469" class="t" text-anchor="middle">2. Drain ALL microtasks</text>
    <rect x="472" y="446" width="190" height="36" rx="8" fill="#f0fdf4" stroke="#16a34a"/>
    <text x="567" y="469" class="t" text-anchor="middle">3. Render if frame due</text>
    <rect x="698" y="446" width="132" height="36" rx="8" fill="#f8fafc" stroke="#64748b"/>
    <text x="764" y="469" class="t" text-anchor="middle">4. Idle → repeat</text>
    <path d="M202,464 L234,464" class="ln" marker-end="url(#a)"/>
    <path d="M438,464 L470,464" class="ln" marker-end="url(#a)"/>
    <path d="M664,464 L696,464" class="ln" marker-end="url(#a)"/>
  </g>
</svg>
