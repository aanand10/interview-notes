<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 470" width="860" height="470" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
  <title>Page lifecycle states</title>
  <style>
    .t { fill: #0f172a; font-size: 14px; }
    .h { fill: #0f172a; font-size: 17px; font-weight: 600; }
    .bt { fill: #0f172a; font-size: 15px; font-weight: 600; }
    .s { fill: #475569; font-size: 12.5px; }
    .ln { stroke: #334155; stroke-width: 1.7; fill: none; }
  </style>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#334155"/>
    </marker>
  </defs>

  <rect x="1" y="1" width="858" height="468" rx="14" fill="#ffffff" stroke="#e2e8f0" stroke-width="2"/>
  <text x="30" y="38" class="h">Page lifecycle: states and the events between them</text>

  <!-- Row 1 -->
  <rect x="30" y="66" width="190" height="70" rx="10" fill="#f8fafc" stroke="#64748b" stroke-width="1.6"/>
  <text x="125" y="92" class="bt" text-anchor="middle">Loading</text>
  <text x="125" y="111" class="s" text-anchor="middle">DOMContentLoaded</text>
  <text x="125" y="127" class="s" text-anchor="middle">→ load</text>

  <rect x="320" y="66" width="190" height="70" rx="10" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.8"/>
  <text x="415" y="96" class="bt" text-anchor="middle">Active</text>
  <text x="415" y="116" class="s" text-anchor="middle">visible + focused</text>

  <rect x="620" y="66" width="190" height="70" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="1.8"/>
  <text x="715" y="96" class="bt" text-anchor="middle">Passive</text>
  <text x="715" y="116" class="s" text-anchor="middle">visible, not focused</text>

  <path d="M222,101 L318,101" class="ln" marker-end="url(#a)"/>
  <text x="270" y="92" class="s" text-anchor="middle">shown</text>
  <path d="M512,88 L618,88" class="ln" marker-end="url(#a)"/>
  <text x="565" y="80" class="s" text-anchor="middle">blur</text>
  <path d="M618,116 L512,116" class="ln" marker-end="url(#a)"/>
  <text x="565" y="132" class="s" text-anchor="middle">focus</text>

  <!-- Row 2 -->
  <rect x="320" y="226" width="190" height="70" rx="10" fill="#fffbeb" stroke="#d97706" stroke-width="1.8"/>
  <text x="415" y="256" class="bt" text-anchor="middle">Hidden</text>
  <text x="415" y="276" class="s" text-anchor="middle">other tab, minimised, locked</text>

  <rect x="30" y="226" width="190" height="70" rx="10" fill="#f5f3ff" stroke="#7c3aed" stroke-width="1.8"/>
  <text x="125" y="256" class="bt" text-anchor="middle">Frozen</text>
  <text x="125" y="276" class="s" text-anchor="middle">timers + tasks paused</text>

  <rect x="620" y="226" width="190" height="70" rx="10" fill="#f1f5f9" stroke="#475569" stroke-width="1.6"/>
  <text x="715" y="256" class="bt" text-anchor="middle">Terminated</text>
  <text x="715" y="276" class="s" text-anchor="middle">page unloaded</text>

  <path d="M395,138 L395,224" class="ln" marker-end="url(#a)"/>
  <path d="M435,224 L435,138" class="ln" marker-end="url(#a)"/>
  <text x="385" y="176" class="s" text-anchor="end">visibilitychange</text>
  <text x="385" y="192" class="s" text-anchor="end">→ hidden</text>
  <text x="445" y="176" class="s">visibilitychange</text>
  <text x="445" y="192" class="s">→ visible</text>

  <path d="M318,248 L222,248" class="ln" marker-end="url(#a)"/>
  <text x="270" y="240" class="s" text-anchor="middle">freeze</text>
  <path d="M222,276 L318,276" class="ln" marker-end="url(#a)"/>
  <text x="270" y="292" class="s" text-anchor="middle">resume</text>

  <path d="M512,261 L618,261" class="ln" marker-end="url(#a)"/>
  <text x="565" y="252" class="s" text-anchor="middle">close / leave</text>
  <text x="565" y="282" class="s" text-anchor="middle">(pagehide)</text>

  <!-- Row 3 -->
  <rect x="30" y="366" width="190" height="70" rx="10" fill="#fef2f2" stroke="#dc2626" stroke-width="1.8"/>
  <text x="125" y="396" class="bt" text-anchor="middle">Discarded</text>
  <text x="125" y="416" class="s" text-anchor="middle">tab killed, reloads on return</text>
  <path d="M125,298 L125,364" class="ln" marker-end="url(#a)"/>
  <text x="135" y="336" class="s">memory pressure</text>

  <!-- Tip -->
  <rect x="320" y="340" width="490" height="96" rx="10" fill="#fffbeb" stroke="#f59e0b" stroke-dasharray="5 4"/>
  <text x="340" y="366" class="t" font-weight="600">Rule of thumb</text>
  <text x="340" y="388" class="t">Save state + send analytics on visibilitychange → hidden.</text>
  <text x="340" y="408" class="t">It may be the last event you get (mobile can kill the tab).</text>
  <text x="340" y="428" class="t">Avoid unload: unreliable and it blocks the bfcache.</text>
</svg>
